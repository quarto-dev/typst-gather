[package]
name = "typst-gather"
version = "0.2.3"
edition = "2021"
description = "Gather Typst packages locally for offline/hermetic builds."
license = "MIT"
readme = "README.md"
repository = "https://github.com/quarto-dev/typst-gather"
rust-version = "1.81"

[dependencies]
typst-kit = { version = "0.14.2", features = ["packages"] }
typst-syntax = "0.14.2"
ecow = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
walkdir = "2"
globset = "0.4"

[features]
default = []
vendored-openssl = ["typst-kit/vendor-openssl"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
